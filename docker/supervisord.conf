; =====================================================================
; Jugajug Social Network — Production Supervisord Process Manager
; =====================================================================
; এই কনফিগারেশন ফাইলটি প্রোডাকশনে কিউ ওয়ার্কারসমূহ এবং রিভার্ব ওয়েবসকেট
; সার্ভারকে অটো-রিস্টার্ট ও ব্যাকগ্রাউন্ডে নিরবচ্ছিন্নভাবে চালু রাখে।

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

; ---------------------------------------------------------------------
; ১. পিএইচপি-এফপিএম (PHP-FPM) ওয়েব রিকোয়েস্ট হ্যান্ডলার
; ---------------------------------------------------------------------
[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm.error.log

; ---------------------------------------------------------------------
; ২. হাই-প্রায়োরিটি কিউ ওয়ার্কার (চ্যাট ও জরুরি নোটিফিকেশন)
; ---------------------------------------------------------------------
[program:laravel-worker-high]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=high --sleep=1 --tries=3 --max-time=3600 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-high.log
stopwaitsecs=3600

; ---------------------------------------------------------------------
; ৩. ডিফল্ট কিউ ওয়ার্কার (লাইক, কমেন্ট ও ফিড ফ্যানআউট)
; ---------------------------------------------------------------------
[program:laravel-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=default --sleep=2 --tries=3 --max-time=3600 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-default.log
stopwaitsecs=3600

; ---------------------------------------------------------------------
; ৪. মিডিয়া কিউ ওয়ার্কার (ভিডিও কনভার্সন, রেজোলিউশন ও ইমেজ প্রসেসিং)
; ---------------------------------------------------------------------
[program:laravel-worker-media]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=media --sleep=3 --tries=2 --max-time=7200 --memory=512
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-media.log
stopwaitsecs=7200

; ---------------------------------------------------------------------
; ৫. লো-প্রায়োরিটি কিউ ওয়ার্কার (অ্যানালিটিক্স লগিং ও স্টোরি ক্লিনআপ)
; ---------------------------------------------------------------------
[program:laravel-worker-low]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=low --sleep=5 --tries=3 --max-time=3600 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-low.log
stopwaitsecs=3600

; ---------------------------------------------------------------------
; ৬. লারাভেল রিভার্ব (Laravel Reverb) ওয়েবসকেট ব্রডকাস্ট সার্ভার
; ---------------------------------------------------------------------
[program:laravel-reverb]
process_name=%(program_name)s
command=php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/reverb.log
stopwaitsecs=60
