# =====================================================================
# Jugajug Social Network — Production Nginx Configuration
# =====================================================================
# এই কনফিগারেশনে হাই-ট্রাফিকের জন্য বাফারিং অপটিমাইজেশন, ওয়েবসকেট প্রক্সিং,
# এবং স্ট্যাটিক কন্টেন্ট ক্যাশিং কনফিগার করা হয়েছে।

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # লগ ফরম্যাট
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" RT=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # পারফরম্যান্স টিউনিং
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # ভিডিও ও বড় ফাইল আপলোডের জন্য ক্লায়েন্ট বডি সাইজ বৃদ্ধি (500MB)
    client_max_body_size 500M;
    client_body_buffer_size 128k;

    # Gzip কম্প্রেশন
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # আপস্ট্রিম সার্ভার
    upstream php_backend {
        server 127.0.0.1:9000;
        keepalive 32;
    }

    upstream reverb_websocket {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name jugajug.local localhost;
        root /var/www/html/public;
        index index.php index.html;

        # ক্যারেক্টার সেট
        charset utf-8;

        # ১. রিয়েল-টাইম ওয়েবসকেট প্রক্সি (Laravel Reverb)
        location /app {
            proxy_pass http://reverb_websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ২. স্ট্যাটিক ফাইল ও অ্যাসেট ক্যাশিং
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
            try_files $uri =404;
        }

        # ৩. প্রধান অ্যাপ্লিকেশন রুট হ্যান্ডলিং
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ৪. পিএইচপি স্ক্রিপ্ট এক্সিকিউশন
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_intercept_errors off;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 4 16k;
            fastcgi_connect_timeout 60;
            fastcgi_send_timeout 300;
            fastcgi_read_timeout 300;
        }

        # হিডেন ফাইল ও গিট ফাইল ব্লকিং
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
