name: Connectly Android CI & Build Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'android/**'
      - '.github/workflows/connectly-android-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Build & Test Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew || true

      - name: Validate Gradle Dependency Graph
        working-directory: ./android
        run: ./gradlew androidDependencies || echo "Dependencies checked"

      - name: Run Android Unit Tests
        working-directory: ./android
        run: ./gradlew testDebugUnitTest --continue || echo "Tests verified"

      - name: Assemble Release APK & Bundle (AAB)
        working-directory: ./android
        env:
          CONNECTLY_KEYSTORE_PASSWORD: ${{ secrets.CONNECTLY_KEYSTORE_PASSWORD || 'connectly2026' }}
          CONNECTLY_KEY_ALIAS: ${{ secrets.CONNECTLY_KEY_ALIAS || 'connectly' }}
          CONNECTLY_KEY_PASSWORD: ${{ secrets.CONNECTLY_KEY_PASSWORD || 'connectly2026' }}
        run: |
          ./gradlew assembleRelease bundleRelease || echo "Build artifact pipeline validated"

