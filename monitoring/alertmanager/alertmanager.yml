global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'admin-webhook'

receivers:
  - name: 'admin-webhook'
    webhook_configs:
      - url: 'http://nginx/api/v1/admin/security/events'
        send_resolved: true
