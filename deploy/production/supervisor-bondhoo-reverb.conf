[program:bondhoo-reverb]
process_name=%(program_name)s
directory=/var/www/bondhoo.com
command=/usr/bin/php /var/www/bondhoo.com/artisan reverb:start --host=127.0.0.1 --port=8080
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/bondhoo.com/storage/logs/reverb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=10
minfds=10000
