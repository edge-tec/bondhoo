apiVersion: apps/v1
kind: Deployment
metadata:
  name: jugajug-canary
  namespace: jugajug-prod
  labels:
    app: jugajug
    track: canary
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app: jugajug
      track: canary
  template:
    metadata:
      labels:
        app: jugajug
        track: canary
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - jugajug
                topologyKey: kubernetes.io/hostname
      containers:
        - name: app
          image: registry.jugajug.com/app:v2.0.0-canary
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
