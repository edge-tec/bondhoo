apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jugajug-app-hpa
  namespace: jugajug-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jugajug-app
  minReplicas: 5
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jugajug-app-pdb
  namespace: jugajug-prod
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: jugajug-app
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jugajug-media-pvc
  namespace: jugajug-prod
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
